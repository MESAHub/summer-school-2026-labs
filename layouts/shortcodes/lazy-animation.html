{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "Animation" -}}
{{- $button := .Get "button" | default "Load animation" -}}

<div class="hx-my-4" data-lazy-animation>
  <button
    type="button"
    class="hx-rounded-md hx-border hx-border-gray-300 hx-bg-white hx-px-3 hx-py-2 hx-text-sm hx-font-medium hx-text-gray-800 hx-shadow-sm hover:hx-bg-gray-50 dark:hx-border-neutral-700 dark:hx-bg-neutral-900 dark:hx-text-gray-100 dark:hover:hx-bg-neutral-800"
    data-lazy-animation-button
    data-src="{{ $src | safeURL }}"
    data-alt="{{ $alt }}"
  >
    {{ $button }}
  </button>
  <div class="hx-mt-3" data-lazy-animation-target></div>
  <noscript>
    <p><a href="{{ $src | safeURL }}">{{ $alt }}</a></p>
  </noscript>
</div>
